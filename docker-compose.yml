services:
  mongodb:
    image: mongo:latest
    container_name: ecommerce-mongodb
    ports: 
      - "27017:27017"
    volumes:
      - ./data:/data/db

  kafka:
    image: apache/kafka:latest
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api_gateway:
    build: ./api_gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user_service:3001/user
      PRODUCT_SERVICE_URL: http://product_service:3002/product
      CART_SERVICE_URL: http://cart_service:3003/cart
      ORDER_SERVICE_URL: http://order_service:3004/order
      JWT_ACCESS: 8ac678b57b6420e95420a7afe9c1793a736a17fc91c82d3733ca6c41579aaab85394b74b0dd51d3acde99673eb821183f864c47c84fff8d3c5ca15738e36dc79
      JWT_REFRESH: 873d3e9346cc8dc8468b7999dc6b946252d294322c56231889456dceb9c800100f3b04ed6e2dcccfbcbd521bcc29dc4d6f92ae4e09abb356cf1f61fae9159953


  user_service:
    build: ./user_service
    container_name: user-service
    ports: 
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URL: mongodb://mongodb:27017/micro_user      
      JWT_ACCESS: 8ac678b57b6420e95420a7afe9c1793a736a17fc91c82d3733ca6c41579aaab85394b74b0dd51d3acde99673eb821183f864c47c84fff8d3c5ca15738e36dc79
      JWT_REFRESH: 873d3e9346cc8dc8468b7999dc6b946252d294322c56231889456dceb9c800100f3b04ed6e2dcccfbcbd521bcc29dc4d6f92ae4e09abb356cf1f61fae9159953

  product_service:
    build: ./product_service
    container_name: product-service
    ports: 
      - "3002:3002"
    environment:
      PORT: 3002
      KAFKA_BROKER: kafka:9092
      MONGODB_URL: mongodb://mongodb:27017/micro_product
      USER_SERVICE_URL: http://user_service:3001/user
    depends_on:
      kafka:
        condition: service_healthy

  cart_service:
    build: ./cart_service
    container_name: cart-service
    ports: 
      - "3003:3003"
    environment:
      PORT: 3003
      KAFKA_BROKER: kafka:9092
      MONGODB_URL: mongodb://mongodb:27017/micro_cart
      PRODUCT_SERVICE_URL: http://product_service:3002/product
    depends_on:
      kafka:
        condition: service_healthy

  order_service:
    build: ./order_service
    container_name: order-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      KAFKA_BROKER: kafka:9092
      MONGODB_URL: mongodb://mongodb:27017/micro_order
      CART_SERVICE_URL: http://cart_service:3003/cart
      USER_SERVICE_URL: http://user_service:3001/user
      PRODUCT_SERVICE_URL: http://product_service:3002/product
    depends_on:
      kafka:
        condition: service_healthy
